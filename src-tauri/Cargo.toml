[package]
name = "quin-gallery"
version = "1.0.0"
description = "Quin Gallery - local media gallery, video editor, player and browser"
authors = ["Quin"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quin_gallery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
zstd = { version = "0.13", features = ["zstdmt"] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "unstable", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
unicode-normalization = "0.1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
notify = "7"
notify-debouncer-full = "0.4"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dunce = "1"
trash = "5"
kamadak-exif = "0.6"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
blake3 = "1"
mime_guess = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors"] }
local-ip-address = "0.6"
base64 = "0.22"
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
zstd = "0.13"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream", "gzip", "brotli", "cookies"] }
futures-util = "0.3"
drag = "2.1.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Network-level video sniffing in the embedded browser talks to WebView2 directly.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell"] }

# The lock screen's PBKDF2 (100k rounds) takes seconds unoptimised; keep the crypto fast in dev builds too.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
