<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quin Gallery — LAN</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0a0a0c; color: rgba(255,255,255,0.92);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; background: rgba(17,17,20,0.85); backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header input {
    margin-left: auto; background: #1a1a1e; border: none; border-radius: 10px;
    color: white; padding: 8px 12px; font-size: 13px; width: 200px;
  }
  main { padding: 14px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px;
  }
  .card {
    position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden;
    background: #1a1a1e; cursor: pointer;
  }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge {
    position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.55);
    padding: 2px 6px; border-radius: 6px; font-size: 10px;
  }
  .empty { text-align: center; color: rgba(255,255,255,0.4); padding: 60px 0; font-size: 13px; }
  #lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none;
    align-items: center; justify-content: center; flex-direction: column; z-index: 20;
  }
  #lightbox.open { display: flex; }
  #lightbox img, #lightbox video { max-width: 92vw; max-height: 82vh; border-radius: 8px; }
  #lightbox .bar {
    position: absolute; top: 0; left: 0; right: 0; display: flex; padding: 12px 16px;
    align-items: center; gap: 10px;
  }
  #lightbox .bar button {
    margin-left: auto; background: rgba(255,255,255,0.1); border: none; color: white;
    border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
</style>
</head>
<body>
<header>
  <h1>Quin Gallery</h1>
  <input id="search" placeholder="Search…" />
</header>
<main>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">No media found.</div>
</main>
<div id="lightbox">
  <div class="bar">
    <span id="lightbox-name"></span>
    <button onclick="closeLightbox()">Close</button>
  </div>
  <div id="lightbox-content"></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';

function api(path) {
  const sep = path.includes('?') ? '&' : '?';
  return fetch(path + sep + 'token=' + encodeURIComponent(token));
}

function fmtDuration(ms) {
  if (ms === null || ms === undefined) return '';
  const s = Math.round(ms / 1000);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return m + ':' + String(sec).padStart(2, '0');
}

let searchTimer = null;
document.getElementById('search').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => load(e.target.value), 250);
});

async function load(search) {
  const q = search ? '&search=' + encodeURIComponent(search) : '';
  const res = await api('/api/media?limit=300' + q);
  if (!res.ok) {
    document.getElementById('grid').innerHTML = '';
    document.getElementById('empty').style.display = 'block';
    document.getElementById('empty').textContent = res.status === 401 ? 'Invalid or expired link.' : 'Error loading gallery.';
    return;
  }
  const data = await res.json();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  document.getElementById('empty').style.display = data.items.length ? 'none' : 'block';
  for (const item of data.items) {
    const card = document.createElement('div');
    card.className = 'card';
    const img = document.createElement('img');
    img.src = '/api/media/' + item.id + '/thumb?token=' + encodeURIComponent(token);
    img.loading = 'lazy';
    card.appendChild(img);
    if (item.media_type === 'video') {
      const badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = fmtDuration(item.duration_ms);
      card.appendChild(badge);
    }
    card.onclick = () => openLightbox(item);
    grid.appendChild(card);
  }
}

function openLightbox(item) {
  const box = document.getElementById('lightbox');
  const content = document.getElementById('lightbox-content');
  document.getElementById('lightbox-name').textContent = item.filename;
  content.innerHTML = '';
  if (item.media_type === 'video') {
    const video = document.createElement('video');
    video.src = '/api/media/' + item.id + '/stream?token=' + encodeURIComponent(token);
    video.controls = true;
    video.autoplay = true;
    content.appendChild(video);
  } else {
    const img = document.createElement('img');
    img.src = '/api/media/' + item.id + '/stream?token=' + encodeURIComponent(token);
    content.appendChild(img);
  }
  box.classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-content').innerHTML = '';
}

load('');
</script>
</body>
</html>
